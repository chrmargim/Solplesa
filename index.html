<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quiz</title>
<style>
  :root{
    --bg: #f6f4ef;
    --ink: #22281f;
    --accent: #3f6b4a;
    --accent-soft: #dfe9de;
    --wrong: #b3492f;
    --wrong-soft: #f4ddd6;
    --card: #ffffff;
    --border: #dedbd0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(10px, 2.5dvh, 24px) 16px;
    padding-top: max(clamp(10px, 2.5dvh, 24px), env(safe-area-inset-top));
    padding-bottom: max(clamp(10px, 2.5dvh, 24px), env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .wrap{
    width:100%;
    max-width: 460px;
  }
  .progress{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: clamp(10px, 2dvh, 22px);
  }
  .progress-track{
    flex:1;
    height:4px;
    background:var(--border);
    border-radius: 2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition: width .35s ease;
  }
  .progress-label{
    font-size:12px;
    color:#6b6a60;
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }
  .image-frame{
    width:100%;
    aspect-ratio: 16 / 9;
    max-height: 30dvh;
    border-radius:14px;
    overflow:hidden;
    margin-bottom: clamp(10px, 2dvh, 20px);
    background:#e7e4d9;
  }
  .image-frame img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding: clamp(16px, 3dvh, 28px) clamp(16px, 4vw, 24px);
    transition: transform .2s ease;
  }
  .question{
    font-size: clamp(16px, 4vw, 19px);
    line-height:1.35;
    margin: 0 0 clamp(12px, 2dvh, 22px) 0;
    font-weight:600;
  }
  .answers{
    display:flex;
    flex-direction:column;
    gap: clamp(7px, 1.2dvh, 10px);
  }
  button.answer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    text-align:left;
    padding: clamp(10px, 1.8dvh, 14px) 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--ink);
    font-size: clamp(13px, 3.6vw, 15px);
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
    font-family:inherit;
  }
  button.answer:active{ transform: scale(0.99); }
  button.answer:hover:not(:disabled){ border-color:#b9b6a8; }
  button.answer:disabled{ cursor:default; }
  .mark{
    font-size:14px;
    opacity:0;
    transform: scale(0.5);
    transition: opacity .2s ease, transform .2s ease;
    flex-shrink:0;
  }
  .mark.show{ opacity:1; transform: scale(1); }
  button.answer.correct{
    background:var(--accent-soft);
    border-color:var(--accent);
    animation: pulseCorrect .4s ease;
  }
  button.answer.wrong{
    background:var(--wrong-soft);
    border-color:var(--wrong);
    animation: shakeWrong .4s ease;
  }
  @keyframes pulseCorrect{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.03); }
    100%{ transform:scale(1); }
  }
  @keyframes shakeWrong{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-6px); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
  }
  .feedback{
    min-height: 16px;
    margin-top: clamp(8px, 1.5dvh, 14px);
    font-size: 13px;
  }
  .feedback.wrong-text{ color:var(--wrong); }
  .feedback.correct-text{ color:var(--accent); }
  .footer{
    margin-top: clamp(8px, 1.5dvh, 16px);
    text-align:center;
    font-size:11px;
    color:#8c8a7d;
  }
  .done{
    text-align:center;
    padding: clamp(20px, 4dvh, 40px) 20px;
  }
  .done h1{
    font-size:20px;
    margin-bottom:8px;
  }
  .done p{
    color:#6b6a60;
    font-size:13px;
  }
  .restart{
    margin-top:16px;
    padding:12px 20px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#fff;
    cursor:pointer;
    font-size:14px;
    font-family:inherit;
  }
  .welcome{
    text-align:center;
    padding: clamp(20px, 4dvh, 44px) 20px;
  }
  .welcome h1{
    font-size: clamp(18px, 5vw, 24px);
    margin: 0 0 10px 0;
  }
  .welcome p{
    color:#6b6a60;
    font-size:13px;
    margin:0 0 20px 0;
    white-space:pre-line;
    line-height:1.45;
  }
  .start-btn{
    padding:13px 30px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition: transform .1s ease, opacity .15s ease;
  }
  .start-btn:active{ transform: scale(0.97); }
  .final-screen{
    text-align:center;
    padding: clamp(16px, 3dvh, 30px) 20px;
  }
  .final-screen h1{
    font-size:20px;
    margin: 0 0 10px 0;
  }
  .final-screen p{
    color:#6b6a60;
    font-size:13px;
    margin:0;
    line-height:1.4;
  }
  .loading-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:12px;
  }
  .loading-dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background: var(--accent);
    opacity:0.4;
    animation: dotPulse 1s infinite ease-in-out;
  }
  .loading-dots span:nth-child(2){ animation-delay: .15s; }
  .loading-dots span:nth-child(3){ animation-delay: .3s; }
  @keyframes dotPulse{
    0%, 80%, 100%{ transform:scale(0.6); opacity:0.35; }
    40%{ transform:scale(1); opacity:1; }
  }
  .wait-indicator{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:12px;
  }
  .spin-emoji{
    font-size:22px;
    display:inline-block;
    animation: spinEmoji 1.1s linear infinite;
  }
  @keyframes spinEmoji{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="progress" id="progressBar" style="display:none;">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">1 / 19</div>
  </div>
  <div id="imageFrame" class="image-frame" style="display:none;"><img id="questionImg" src="" alt=""></div>
  <div class="card" id="card"></div>
  <div class="footer" id="footerHint" style="display:none;">Selecciona la respuesta correcta para avanzar</div>
</div>

<script>
const questions = [
  { q: "¿A qué ser le haces más fotos?", a: ["Perros", "Gatos", "A tu amorcito"], correct: 2, img: "images/2.jpg" },
  { q: "¿Cuánto te gusta que te lleve galletillas a casa?", a: ["17/100", "99/10", "79/100"], correct: 1, img: "images/3.jpg" },
  { q: "¿Quién hace los ramos silvestres más bonitos?", a: ["Julia", "Mi Kutxipurri (Julia)"], correct: 1, img: "images/4.jpg" },
  { q: "¿Cómo de bien estoy cuidando ese corazoncito?", a: ["Mu bien mu bien", "No está mal", "Cada vez mejor"], correct: 2, img: "images/5.jpg" },
  { q: "¿Qué pelicula hace llorar a mi bomboncito?", a: ["Iron Man", "Indiana Jones", "Carmen y Lola"], correct: 2, img: "images/6.jpg" },
  { q: "¿Quién se hace más el/la sordx para no escuchar al otrx a veces?", a: ["Cara Huevo (Chris)", "Los dos porque estamos en nuestro mundillo", "Cara Huevo (Juli)"], correct: 1, img: "images/7.jpg" },
  { q: "¿Cuánto de reinas somos al montar la tienda de campaña en un kimping?", a: ["1000", "MEGA NIÑO!!", "999"], correct: 1, img: "images/8.jpg" },
  { q: "¿Estás cansada de reponder preguntas?", a: ["Sí", "No", "Sí", "No", "Sí", "No"], correct: 5, img: "images/9.jpg" },
  { q: "¿...?", a: ["...", "...", "...", "...", "..."], correct: 3, img: "images/10.jpg" },
  { q: "¿Cuánto de mal lo pasas cuando te llevo a la nieve a dormir en la Touri?", a: ["Oye pues, ni tan mal porque dormimos abrazados", "Oye, no voy a volver, no os soporto", "¿Nieve?"], correct: 0, img: "images/11.jpg" },
  { q: "¿Cuándo la Juli se enfada...?", a: ["... se bebe una fanta", "... toca la flauta", "... tostada de sobrasada"], correct: 2, img: "images/12.jpg" },
  { q: "¿Somos la pareja más carabuevo del planeta?", a: ["¡¡¡¡YES!!!!", "¡¡YES!!", "¡YES!"], correct: 0, img: "images/13.jpg" },
  { q: "¿La última más graciosa que he soltado?", a: ["Tanto Tesla, tanto tesla", "que vaya ¡¡BIEEEEN!!", "ellll SSSSsssSombri"], correct: 1, img: "images/14.jpg" },
  { q: "¿A quién hay que darle los yogures sin abrir?", a: ["😹🙊😹"], correct: 0, img: "images/15.jpg" },
  { q: "¿Vamos a perdonar alguna vez el postre cenando?", a: ["Sí", "No", "Sí"], correct: 1, img: "images/16.jpg" },
  { q: "¿Quieres saber ya el destino?", a: ["Sí", "Sí", "No"], correct: 0, img: "images/17.jpg" },
  { q: "Venga que me he portado mal en algunas respuestas (la correcta es la 3😚)", a: ["hahahahaha", "hahahahaha", "hahahahaha ¿seguro?"], correct: 2, img: "images/18.jpg" },
  { q: "¿Esta eres tú esperando a que se acaben las preguntas que te he preparado para saber el destino? YES!", a: ["Veeeenga, la última"], correct: 0, img: "images/19.jpg" },
  { q: "¿Te suena esto?", a: ["Sí", "No"], correct: 1, img: "images/20.jpg" }
];

// Tiempo (en milisegundos) que se espera tras responder antes de pasar a la siguiente pregunta / reiniciar.
const DECISION_DELAY = 2500;

// Tiempo (en milisegundos) que se mantiene la pantalla "Sí" (incorrecta) de la última pregunta antes de reiniciar.
// Es un valor DISTINTO y más largo para dar tiempo de sobra a leer el texto.
const FINAL_HOLD_DELAY = 8000;

// Imágenes y textos de las pantallas finales de la última pregunta.
// EDITA AQUI los textos de cada pantalla final:
const FINAL_NO_IMAGE = "images/no.jpg";
const FINAL_NO_TITLE = "AHHHHH 💋💋💋💋💋💋";                                                      // <-- título en negrita de la pantalla "No"
const FINAL_NO_TEXT = "NOS VAMOS A TABARCA (estaba pendiente) Te quiero 🦆🌻";      // <-- texto de la pantalla "No" (respuesta correcta)
const FINAL_SI_IMAGE = "images/si.jpg";
const FINAL_SI_TITLE = "Mi última maldad 😈 ";                                     // <-- título en negrita de la pantalla "Sí"
const FINAL_SI_TEXT = " Venga que ya sabes donde vamos pero tienes que ver el final 🦭 ";  // <-- texto de la pantalla "Sí" (respuesta incorrecta)

// Emoji que gira mientras se espera para pasar de pregunta / pantalla.
// Uno distinto por cada una de las 19 preguntas (en el mismo orden que el array "questions").
// Cambia cualquiera de ellos por el que prefieras.
const WAIT_EMOJIS = [
  "🐵", "🐱", "🐰", "🦊", "🐻",
  "🐼", "🐨", "🐯", "🦁", "🐮",
  "🐷", "🐸", "🐶", "🐔", "🦉",
  "🦄", "🐴", "🐺", "🐧"
];

let current = 0;
let locked = false;
let started = false;

const card = document.getElementById("card");
const progressBar = document.getElementById("progressBar");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");
const imageFrame = document.getElementById("imageFrame");
const questionImg = document.getElementById("questionImg");
const footerHint = document.getElementById("footerHint");

function createDots(emoji) {
  const wrap = document.createElement("div");
  wrap.className = "wait-indicator";

  const emojiEl = document.createElement("span");
  emojiEl.className = "spin-emoji";
  emojiEl.textContent = emoji || "🐧";
  wrap.appendChild(emojiEl);

  return wrap;
}

function renderWelcome() {
  progressBar.style.display = "none";
  footerHint.style.display = "none";
  imageFrame.style.display = "block";
  questionImg.src = "images/1.jpg";
  questionImg.alt = "Portada";
  card.innerHTML = "";
  const welcome = document.createElement("div");
  welcome.className = "welcome";
  welcome.innerHTML = `
    <h1>🎉¡MUCHAS FELICIDADES MI AMORRRR!❤️</h1>
    <p>Juega y diviertete con el cuestionario 😈
Si fallas vuelves a empezar, piensa bien tus respuestas 👾
Al completarlo se desvelará el destino 🎆</p>
    <button class="start-btn" id="startBtn">Comenzar</button>
  `;
  card.appendChild(welcome);
  document.getElementById("startBtn").addEventListener("click", () => {
    started = true;
    current = 0;
    render();
  });
}

function render() {
  if (!started) {
    renderWelcome();
    return;
  }
  locked = false;
  if (current >= questions.length) {
    renderDone();
    return;
  }
  const item = questions[current];

  progressBar.style.display = "flex";
  footerHint.style.display = "block";
  progressFill.style.width = ((current) / questions.length * 100) + "%";
  progressLabel.textContent = (current + 1) + " / " + questions.length;

  imageFrame.style.display = "block";
  questionImg.src = item.img;
  questionImg.alt = item.q;

  card.innerHTML = "";
  const qEl = document.createElement("p");
  qEl.className = "question";
  qEl.textContent = item.q;
  card.appendChild(qEl);

  const answersEl = document.createElement("div");
  answersEl.className = "answers";

  const feedback = document.createElement("div");
  feedback.className = "feedback";

  item.a.forEach((text, idx) => {
    const btn = document.createElement("button");
    btn.className = "answer";
    const label = document.createElement("span");
    label.textContent = text;
    const mark = document.createElement("span");
    mark.className = "mark";
    btn.appendChild(label);
    btn.appendChild(mark);
    btn.addEventListener("click", () => handleAnswer(idx, btn, mark, answersEl, feedback));
    answersEl.appendChild(btn);
  });

  card.appendChild(answersEl);
  card.appendChild(feedback);
}

function handleAnswer(idx, btn, mark, answersEl, feedback) {
  if (locked) return;
  locked = true;
  const item = questions[current];
  const isLastQuestion = current === questions.length - 1;
  Array.from(answersEl.children).forEach(b => b.disabled = true);

  if (idx === item.correct) {
    btn.classList.add("correct");
    mark.textContent = "✓";
    mark.classList.add("show");

    if (isLastQuestion) {
      // Respuesta "No" (correcta) -> pantalla final definitiva, sin botón, sin espera posterior.
      setTimeout(() => {
        renderFinalScreen(FINAL_NO_IMAGE, FINAL_NO_TITLE, FINAL_NO_TEXT, false);
      }, 600);
      return;
    }

    feedback.textContent = "Mu bien mu bien, pa'la siguiente 😚.";
    feedback.className = "feedback correct-text";
    feedback.appendChild(createDots(WAIT_EMOJIS[current]));
    setTimeout(() => {
      current++;
      render();
    }, DECISION_DELAY);
  } else {
    btn.classList.add("wrong");
    mark.textContent = "✗";
    mark.classList.add("show");

    if (isLastQuestion) {
      // Respuesta "Sí" (incorrecta) -> se muestra su pantalla durante FINAL_HOLD_DELAY y luego reinicia.
      renderFinalScreen(FINAL_SI_IMAGE, FINAL_SI_TITLE, FINAL_SI_TEXT, true);
      setTimeout(() => {
        current = 0;
        render();
      }, FINAL_HOLD_DELAY);
      return;
    }

    feedback.textContent = "Caaaaaasiii, pa'la primera, mi chica 😛.";
    feedback.className = "feedback wrong-text";
    feedback.appendChild(createDots(WAIT_EMOJIS[current]));
    setTimeout(() => {
      current = 0;
      render();
    }, DECISION_DELAY);
  }
}

function renderFinalScreen(imageSrc, title, text, showDots) {
  progressBar.style.display = "none";
  footerHint.style.display = "none";
  imageFrame.style.display = "block";
  questionImg.src = imageSrc;
  questionImg.alt = title;

  card.innerHTML = "";
  const final = document.createElement("div");
  final.className = "final-screen";
  final.innerHTML = `
    <h1>${title}</h1>
    <p>${text}</p>
  `;
  card.appendChild(final);
  if (showDots) {
    final.appendChild(createDots(WAIT_EMOJIS[WAIT_EMOJIS.length - 1]));
  }
}

function renderDone() {
  progressBar.style.display = "flex";
  imageFrame.style.display = "none";
  footerHint.style.display = "none";
  progressFill.style.width = "100%";
  progressLabel.textContent = questions.length + " / " + questions.length;
  card.innerHTML = "";
  const done = document.createElement("div");
  done.className = "done";
  done.innerHTML = `
    <h1>Completado</h1>
    <p>Has respondido correctamente las ${questions.length} preguntas.</p>
    <button class="restart" id="restartBtn">Volver a empezar</button>
  `;
  card.appendChild(done);
  document.getElementById("restartBtn").addEventListener("click", () => {
    current = 0;
    render();
  });
}

render();
</script>
</body>
</html>
